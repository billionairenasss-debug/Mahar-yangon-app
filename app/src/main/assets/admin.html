<!doctype html>
<html lang="my">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>မဟာရန်ကုန် · Admin</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
</head>
<body class="admin"><header><a href="index.html"><img src="assets/logo.jpeg" class="logo"></a><strong>MAHAR YANGON · ADMIN</strong>
<a href="index.html" class="back">VIEW SHOP →</a></header>
<main class="admin-main">
<section id="loginPanel" class="panel login"><p class="eyebrow">SECURE ADMIN</p><h1>Store Manager</h1><p class="help">Admin email နဲ့ password သုံးပြီး ဝင်ပါ။</p>
<form id="loginForm"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="btn" type="submit">LOGIN →</button><p id="loginMsg" class="msg"></p></form></section>

<section id="app" class="hidden">
<div id="claimPanel" class="panel hidden"><p class="eyebrow">ONE-TIME SETUP</p><h2>Claim Store Admin</h2><p class="help">ဒီ account ကို Mahar Yangon Store ရဲ့ Admin အဖြစ် တစ်ကြိမ်သာ သတ်မှတ်နိုင်ပါတယ်။</p><button class="btn" onclick="claimAdmin()">CLAIM ADMIN →</button><p id="claimMsg" class="msg"></p></div>
<div class="topbar"><div><p class="eyebrow">PRODUCT MANAGER</p><h1>Manage Collection</h1></div><button class="logout" onclick="logout()">LOG OUT</button></div>
<section class="panel"><h2 id="formTitle">Add Product</h2>
<form id="productForm"><input id="editId" type="hidden">
<label>Product Photo<input id="photo" type="file" accept="image/*"></label>
<div class="two"><label>Product Name<input id="name" required placeholder="Classic Black Tee"></label><label>Price (MMK)<input id="price" type="number" min="0" placeholder="35000"></label></div>
<div class="two"><label>Color<input id="color" placeholder="Black"></label><label>Sizes<input id="sizes" placeholder="S, M, L, XL, XXL"></label></div>
<label><input id="active" type="checkbox" checked> Customer Website မှာ ပြမယ်</label>
<div class="buttons"><button class="btn" type="submit">SAVE PRODUCT</button><button type="button" class="cancel" onclick="resetForm()">CANCEL</button></div>
<p id="formMsg" class="msg"></p></form></section>
<section class="panel"><div class="admin-head"><div><p class="eyebrow">CATALOG</p><h2>Products</h2></div><button class="refresh" onclick="loadAdminProducts()">REFRESH</button></div><div id="list">Loading…</div></section>
</section></main>
<script>
const cfg=window.MAHAR_CONFIG, sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_PUBLISHABLE_KEY);
let current=[];
async function isAdmin(){const {data,error}=await sb.from('admin_users').select('user_id').limit(1);return !error && !!data?.length;}
async function showApp(){document.getElementById('loginPanel').classList.add('hidden');document.getElementById('app').classList.remove('hidden');const admin=await isAdmin();if(!admin){document.getElementById('claimPanel').classList.remove('hidden');return;}loadAdminProducts();}
async function claimAdmin(){const msg=document.getElementById('claimMsg');msg.textContent='Setting up admin…';const {data:{user}}=await sb.auth.getUser();if(!user){msg.textContent='Please login again.';return;}const {error}=await sb.from('admin_users').insert({user_id:user.id});if(error){msg.textContent=error.message;return;}msg.textContent='Admin ready ✓';document.getElementById('claimPanel').classList.add('hidden');loadAdminProducts();}
async function check(){const {data}=await sb.auth.getSession();if(data.session)showApp();}
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('loginMsg');m.textContent='Logging in…';
const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error)m.textContent=error.message;else showApp();}
async function logout(){await sb.auth.signOut();location.reload()}
async function loadAdminProducts(){const {data,error}=await sb.from('products').select('*').order('created_at',{ascending:false});if(error){list.innerHTML='<p class="msg">'+error.message+'</p>';return}current=data||[];
list.innerHTML=current.map(p=>`<div class="row"><img src="${escapeHtml(p.image_url)}"><div><b>${escapeHtml(p.name)}</b><small>${p.price?'MMK '+Number(p.price).toLocaleString():'Price — Message Us'} · ${escapeHtml(p.color||'')} · ${escapeHtml(p.sizes||'')} · ${p.active?'LIVE':'HIDDEN'}</small></div><div class="rowbuttons"><button onclick="editProduct('${p.id}')">EDIT</button><button class="danger" onclick="deleteProduct('${p.id}')">DELETE</button></div></div>`).join('')||'<p class="help">Product မရှိသေးပါ။</p>'}
function editProduct(id){const p=current.find(x=>x.id===id);if(!p)return;editId.value=p.id;name.value=p.name;price.value=p.price??'';color.value=p.color??'';sizes.value=p.sizes??'';active.checked=p.active;document.getElementById('formTitle').textContent='Edit Product';scrollTo({top:0,behavior:'smooth'})}
function resetForm(){document.getElementById('productForm').reset();editId.value='';active.checked=true;document.getElementById('formTitle').textContent='Add Product';formMsg.textContent=''}
async function upload(file){const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=`${crypto.randomUUID()}.${ext}`;
const {error}=await sb.storage.from('product-images').upload(path,file,{contentType:file.type,upsert:false});if(error)throw error;
const {data}=sb.storage.from('product-images').getPublicUrl(path);return {url:data.publicUrl,path};}
document.getElementById('productForm').onsubmit=async e=>{e.preventDefault();formMsg.textContent='Saving…';try{
let image_url='',image_path='';const old=current.find(p=>p.id===editId.value);
if(photo.files[0]){const up=await upload(photo.files[0]);image_url=up.url;image_path=up.path}else if(old){image_url=old.image_url;image_path=old.image_path||''}else{throw new Error('Product photo ထည့်ပေးပါ။')}
const payload={name:name.value.trim(),price:price.value?Number(price.value):null,color:color.value.trim(),sizes:sizes.value.trim(),image_url,image_path,active:active.checked};
let res;if(editId.value)res=await sb.from('products').update(payload).eq('id',editId.value);else res=await sb.from('products').insert(payload);
if(res.error)throw res.error;resetForm();await loadAdminProducts();formMsg.textContent='Saved ✓';
}catch(err){formMsg.textContent=err.message}}
async function deleteProduct(id){if(!confirm('ဒီ Product ကိုဖျက်မလား?'))return;const p=current.find(x=>x.id===id);const {error}=await sb.from('products').delete().eq('id',id);if(error){alert(error.message);return}
if(p?.image_path)await sb.storage.from('product-images').remove([p.image_path]);loadAdminProducts()}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
check();
</script></body></html>
