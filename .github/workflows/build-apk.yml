name: Build Mahar Yangon APKs

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Customer APK
        run: ./gradlew :app:assembleCustomerDebug

      - name: Build Admin APK
        run: ./gradlew :app:assembleAdminDebug

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: Mahar-Yangon-Customer-APK
          path: app/build/outputs/apk/customer/debug/app-customer-debug.apk

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Mahar-Yangon-Admin-APK
          path: app/build/outputs/apk/admin/debug/app-admin-debug.apk
