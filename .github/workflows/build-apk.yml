name: Build Mahar Yangon APKs

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build Customer APK
        run: gradle :app:assembleCustomerDebug

      - name: Build Admin APK
        run: gradle :app:assembleAdminDebug

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: Mahar-Yangon-Customer-APK
          path: app/build/outputs/apk/customer/debug/app-customer-debug.apk

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Mahar-Yangon-Admin-APK
          path: app/build/outputs/apk/admin/debug/app-admin-debug.apk
